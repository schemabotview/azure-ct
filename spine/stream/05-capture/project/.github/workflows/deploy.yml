# Every push to main: build once, release that build to dev, then to prod
# once a person approves the prod environment.
name: deploy
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: infra/06-build.sh
      - uses: actions/upload-artifact@v4
        with: { name: release, path: out/ }
  dev:
    needs: build
    uses: ./.github/workflows/release.yml
    with: { env: dev }
  prod:
    needs: dev
    uses: ./.github/workflows/release.yml
    with: { env: prod }
