# Event Hubs' Kafka endpoint: the namespace is the cluster, a hub a topic.
# No key: an Entra ID token for the producer's app registration.
bootstrap.servers=evh-wg-risk-prod.servicebus.windows.net:9093
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
sasl.oauthbearer.method=oidc
sasl.oauthbearer.token.endpoint.url=https://login.microsoftonline.com/aaaabbbb-0000-cccc-1111-dddd2222eeee/oauth2/v2.0/token
sasl.oauthbearer.scope=https://evh-wg-risk-prod.servicebus.windows.net/.default
sasl.oauthbearer.client.id=11112222-bbbb-3333-cccc-4444dddd5555
# sasl.oauthbearer.client.secret is added from the bank's vault at deployment
